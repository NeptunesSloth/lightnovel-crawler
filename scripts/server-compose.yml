x-torproxy: &torproxy
  image: sdipu/tor-proxy:latest
  restart: unless-stopped
  environment:
    SOCKS_HOST: 0.0.0.0
    CONTROL_HOST: 0.0.0.0
    CONTROL_PASSWORD: "secret"
    SOCKS_POLICY: accept *
  deploy:
    resources:
      limits:
        cpus: "0.25"
        memory: "128M"
      reservations:
        memory: "32M"

services:
  server:
    image: ghcr.io/lncrawl/lightnovel-crawler:latest
    init: true
    ports:
      - "23457:8080"
    command: -ll server -p 8080
    restart: unless-stopped
    environment:
      - LNCRAWL_DATA_PATH=/data
      - DATABASE_URL=postgresql+psycopg://pguser:pgpass@postgres:5432/lncrawl
      - PROXY_URLS=tor;torproxy-1;9150;9151;secret,tor;torproxy-2;9150;9151;secret,tor;torproxy-3;9150;9151;secret
    volumes:
      - ./appdata:/data
    labels:
      - autoheal=true
    healthcheck:
      test:
        - CMD
        - /app/.venv/bin/python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    deploy:
      resources:
        limits:
          cpus: "3.50"
          memory: "4G"
        reservations:
          memory: "512M"

  autoheal:
    image: willfarrell/autoheal:latest
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: 30
      AUTOHEAL_START_PERIOD: 90
    deploy:
      resources:
        limits:
          memory: "128M"
        reservations:
          memory: "16M"

  postgres:
    image: postgres:alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pguser
      POSTGRES_PASSWORD: pgpass
      POSTGRES_DB: lncrawl
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: "512M"
        reservations:
          memory: "128M"

  torproxy-1:
    <<: *torproxy

  torproxy-2:
    <<: *torproxy

  torproxy-3:
    <<: *torproxy
