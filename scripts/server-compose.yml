services:
  server:
    image: ghcr.io/lncrawl/lightnovel-crawler:latest
    ports:
      - "23457:8080"
    command: -ll server -p 8080
    environment:
      - LNCRAWL_DATA_PATH=/data
      - TOR_CONTROL_HOST=torproxy
      - TOR_PROXY_URL=socks5://torproxy:9150
      - DATABASE_URL=postgresql+psycopg://pguser:pgpass@postgres:5432/lncrawl
    volumes:
      - ./appdata:/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "3.00"
          memory: "5G"
        reservations:
          cpus: "2.00"
          memory: "512M"

  postgres:
    image: postgres:alpine
    environment:
      POSTGRES_USER: pguser
      POSTGRES_PASSWORD: pgpass
      POSTGRES_DB: lncrawl
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: "2G"
        reservations:
          memory: "512M"

  torproxy:
    image: sdipu/tor-proxy:latest
    restart: unless-stopped
    environment:
      SOCKS_HOST: 0.0.0.0
      CONTROL_HOST: 0.0.0.0
      CONTROL_PASSWORD: "secret"
      SOCKS_POLICY: accept 127.0.0.1,accept 10.0.0.0/8,accept 172.16.0.0/12,accept 192.168.0.0/16
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: "256M"
        reservations:
          memory: "64M"
