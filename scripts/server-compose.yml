services:
  server:
    image: ghcr.io/lncrawl/lightnovel-crawler:latest
    ports:
      - "23457:8080"
    command: -ll server -p 8080
    environment:
      - LNCRAWL_DATA_PATH=/data
      - TOR_CONTROL_HOST=torproxy
      - TOR_PROXY_URL=socks5h://torproxy:9150
      - DATABASE_URL=postgresql+psycopg://pguser:pgpass@postgres:5432/lncrawl
    volumes:
      - ./appdata:/data
    restart: unless-stopped
    labels:
      - autoheal=true
    healthcheck:
      test:
        - CMD
        - /app/.venv/bin/python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    deploy:
      resources:
        limits:
          cpus: "3.00"
          memory: "5G"
        reservations:
          cpus: "2.00"
          memory: "1G"

  autoheal:
    image: willfarrell/autoheal:latest
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: 30
      AUTOHEAL_START_PERIOD: 90

  postgres:
    image: postgres:alpine
    environment:
      POSTGRES_USER: pguser
      POSTGRES_PASSWORD: pgpass
      POSTGRES_DB: lncrawl
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: "2G"
        reservations:
          memory: "512M"

  torproxy:
    image: sdipu/tor-proxy:latest
    restart: unless-stopped
    environment:
      SOCKS_HOST: 0.0.0.0
      CONTROL_HOST: 0.0.0.0
      CONTROL_PASSWORD: "secret"
      SOCKS_POLICY: accept *
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: "256M"
        reservations:
          memory: "64M"
