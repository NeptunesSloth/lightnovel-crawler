name: Reader browser tests

on:
  workflow_dispatch: {}
  push:
    branches:
      - dev
    paths:
      - "lncrawl/server/reader.py"
      - "lncrawl/server/api/**"
      - "lncrawl/services/reader_state.py"
      - "lncrawl/services/auto_update.py"
      - "lncrawl/services/libraries.py"
      - "lncrawl/services/novels.py"
      - "tests/e2e/**"
      - ".github/workflows/reader-e2e.yml"
  pull_request:
    branches:
      - dev
    paths:
      - "lncrawl/server/reader.py"
      - "lncrawl/server/api/**"
      - "lncrawl/services/reader_state.py"
      - "lncrawl/services/auto_update.py"
      - "lncrawl/services/libraries.py"
      - "lncrawl/services/novels.py"
      - "tests/e2e/**"
      - ".github/workflows/reader-e2e.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reader:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    name: Reader in Chromium
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7

      - name: 🐍 Install uv & Python
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: 📦 Install Dependencies
        run: uv sync --frozen --all-extras --all-groups

      - name: 🟢 Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 🎭 Install Playwright and Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0
          npx playwright install --with-deps chromium

      - name: 🧪 Reader browser tests
        run: uv run python tests/e2e/run_reader_e2e.py
